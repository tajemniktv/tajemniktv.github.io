version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # @astrojs/check currently supports TypeScript 5/6, not 7.
      # Keep receiving TS 6 updates without letting another incompatible major
      # silently break clean installs.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
